<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgrove Operations: admin draft v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF9F4;--card:#fff;--line:#EAE3D3;--ink:#1C2B20;--muted:#6B6252;--soft:#F5F0E4;--dark:#16281D;--dark2:#1B2E23;--gold:#C89B3C;--gs:#E8C77A;--green:#1F6B3E;--red:#A8402B;--amber:#8B6B1F;--sh:0 1px 2px rgba(28,43,32,.05);--shm:0 12px 32px rgba(28,43,32,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',monospace}.serif{font-family:Fraunces,serif}
.banner{background:var(--dark);color:#B9C4B8;font-size:12px;padding:8px 16px;text-align:center}.banner b{color:var(--gs);font-weight:500}
.app{display:flex;min-height:calc(100vh - 33px)}
.side{width:236px;background:var(--dark);padding:20px 14px;flex-shrink:0;position:sticky;top:0;height:calc(100vh - 33px);overflow:auto}
.logo{font-family:Fraunces,serif;font-size:19px;color:#F5EFE2;padding:0 8px}.logo span{color:var(--gold)}
.logo-s{font-size:10px;letter-spacing:.12em;color:rgba(185,196,184,.55);padding:2px 8px 22px}
.grp{font-size:10.5px;letter-spacing:.1em;color:rgba(185,196,184,.45);margin:16px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#B9C4B8;cursor:pointer;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.06)}.nav.on{background:#fff;color:var(--ink);font-weight:500}
.nav .bd{margin-left:auto;background:var(--gold);color:#fff;border-radius:100px;font-size:11px;padding:1px 7px}
.ic{width:16px;height:16px;flex-shrink:0}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.search{flex:1;max-width:400px;display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted);font-size:13px}
.sp{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--dark);color:#F5EFE2;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.who{line-height:1.15}.who b{font-size:13px;font-weight:500;display:block}.who span{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.content{max-width:1180px;margin:0 auto;padding:26px 28px 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.ph h1{font-family:Fraunces,serif;font-weight:500;font-size:27px}.ph p{color:var(--muted);font-size:13.5px;margin-top:2px}
.btn{font:500 13px Inter,sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#d6ccb4}.btn.pri{background:var(--dark);color:#F5EFE2;border-color:var(--dark)}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.link{border:none;background:none;padding:0;color:var(--amber);text-decoration:underline}
.lnk{font-size:12.5px;color:var(--muted);cursor:pointer}.lnk:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.card-h h3{font-family:Fraunces,serif;font-weight:500;font-size:16px}
.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}.kpi .ki{width:34px;height:34px;border-radius:9px;background:rgba(200,155,60,.13);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi.red .ki{background:rgba(168,64,43,.1);color:var(--red)}
.kpi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:Fraunces,serif;font-size:28px;margin:3px 0 2px}.kpi .v em{font-size:12.5px;font-style:italic;color:var(--green);margin-left:6px}.kpi p{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
.row .tx{flex:1;min-width:0}.row .tx b{font-weight:500}.row .tx small{display:block;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.dot.r{background:var(--red)}.dot.g{background:var(--gold)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}.t tr:last-child td{border-bottom:none}
.t tbody tr.clk{cursor:pointer}.t tbody tr.clk:hover{background:rgba(28,43,32,.025)}.t .r{text-align:right}.t .num{font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap}
.t small{display:block;color:var(--muted);font-size:11.5px}
.t tr.old td{color:#9a917e;background:#FAF7F0}.t tr.old .amt{text-decoration:line-through}
.chip{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:100px;font-weight:500;white-space:nowrap}
.chip.gray{background:#EFE9DC;color:var(--muted)}.chip.green{background:var(--green);color:#fff}.chip.lg{background:rgba(31,107,62,.1);color:var(--green)}
.chip.gold{border:1px solid var(--gold);color:var(--amber)}.chip.red{background:rgba(168,64,43,.1);color:var(--red)}.chip.dark{background:var(--dark);color:#F5EFE2}.chip.blue{border:1px solid #B9C4D6;color:#4A5E78}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.fp{padding:6px 13px;border:1px solid var(--line);border-radius:100px;font-size:12.5px;color:var(--muted);cursor:pointer;background:#fff}.fp.on{background:var(--dark);color:#F5EFE2;border-color:var(--dark)}
.fs{margin-left:auto;display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--muted);font-size:12.5px;min-width:220px}
.back{font:500 12px 'IBM Plex Mono',monospace;color:var(--muted);cursor:pointer;margin-bottom:10px;display:inline-block}
.hdr{padding:18px 20px;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hdr h1{font-family:Fraunces,serif;font-weight:500;font-size:23px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hdr .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:11px 14px;border-right:1px solid var(--line);background:#FDFBF7}.stat:last-child{border-right:none}
.stat small{display:block;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}.stat b{font-size:16px;font-weight:600;display:block;margin-top:2px}.stat span{font-size:11.5px;color:var(--muted)}
.stat.dk{background:var(--dark);color:#fff}.stat.dk small{color:var(--gs)}.stat.dk span{color:#B9C4B8}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:2px;padding:0 20px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;margin-bottom:16px;position:sticky;top:57px;z-index:5;align-items:center}
.tab{padding:12px 14px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--ink);font-weight:500;border-color:var(--gold)}.tab em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.attn{display:flex;gap:12px;align-items:center;background:#FFF8E8;border:1px solid #F0DDA8;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:13px}.attn b{font-weight:500}.attn .sp{flex:1}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}.kv small{display:block;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.kv b{font-weight:500}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}.sw{width:30px;height:17px;border-radius:20px;background:#D9D1BD;position:relative}.sw::after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:.15s}.sw.on{background:var(--green)}.sw.on::after{left:15px}
.rowmenu{position:relative;display:inline-block}.more{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:28px;cursor:pointer;color:var(--muted)}
.pop{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shm);min-width:200px;z-index:40;display:none;overflow:hidden;text-align:left}.pop.open{display:block}
.pop a{display:block;padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}.pop a:last-child{border-bottom:none}.pop a:hover{background:var(--soft)}.pop a small{display:block;color:var(--muted);font-size:11.5px}.pop a.dn{color:var(--red)}
.tl{position:relative;padding-left:22px}.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}.tl div{position:relative;padding-bottom:16px}.tl div::before{content:'';position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--gold)}.tl small{display:block;color:var(--muted);font-size:11.5px}
.ov{position:fixed;inset:0;background:rgba(22,40,29,.4);display:none;z-index:50}.ov.open{display:block}
.drawer{position:fixed;top:0;right:-460px;width:440px;max-width:100%;height:100vh;background:#fff;z-index:60;box-shadow:var(--shm);transition:right .25s ease;display:flex;flex-direction:column}.drawer.open{right:0}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dh h2{font-family:Fraunces,serif;font-weight:500;font-size:20px}.db{padding:20px 22px;overflow:auto;flex:1}.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fld{margin-bottom:14px}.fld label{display:block;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:14px Inter,sans-serif;background:#fff}.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,60,.18)}.fld small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.alloc{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}.alloc h4{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.alloc div{display:flex;justify-content:space-between;padding:3px 0}.alloc .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:480px;max-width:92vw;background:#fff;border-radius:14px;z-index:60;box-shadow:var(--shm);display:none}.modal.open{display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#F5EFE2;padding:11px 18px;border-radius:10px;font-size:13px;z-index:70;display:none}.toast.open{display:block}
.empty{text-align:center;padding:36px;color:var(--muted)}
@media(max-width:900px){.side{display:none}.kpis,.stats{grid-template-columns:1fr 1fr}.grid2,.two{grid-template-columns:1fr}}
</style></head><body>
<div class="banner"><b>Draft v2, sample data.</b> Click around: sidebar pages, table rows open detail pages, <b>Record payment</b> opens a drawer, <b>Statement</b> menu opens the send dialog, <b>Show corrections</b> toggles history.</div>
<div class="app"><aside class="side" id="side"></aside>
<div class="main"><header class="top"><div class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Search name, email or reference</div><div class="sp"></div>
<div class="rowmenu"><button class="btn pri" onclick="toggleMenu(event,'mnew')">+ New ▾</button><div class="pop" id="mnew" style="right:auto;left:0"><a onclick="toast('New booking form would open')">New booking</a><a onclick="toast('New transaction form would open')">New transaction</a><a onclick="toast('Manual receipt form would open')">Manual receipt</a></div></div>
<div class="avatar">A</div><div class="who"><b>Admin</b><span>OPERATIONS</span></div></header>
<main class="content" id="view"></main></div></div>
<div class="ov" id="ov" onclick="closeAll()"></div><div class="drawer" id="drawer"></div><div class="modal" id="modal"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const MON={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
const dmy=d=>{const x=d.split(' ');return x[0]+'-'+MON[x[1]]+'-'+x[2]};
const money=n=>'₦'+Math.round(n).toLocaleString('en-US');
const chip=(t,k='gray')=>`<span class="chip ${k}">${t}</span>`;
const I={dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',inbox:'<path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/>',tx:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/>',card:'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/>',doc:'<path d="M6 3h9l5 5v13H5V4a1 1 0 0 1 1-1z"/><path d="M9 13h6M9 17h6"/>',check:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 13 2.5 2.5L16 10"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.2 3.4-7 7.5-7s7.5 2.8 7.5 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v5M12 18h.01"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'};
const ico=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const NAV=[['OVERVIEW',[['dashboard','Dashboard','dash'],['inbox','Inbox','inbox',5]]],['SALES',[['bookings','Bookings','cal'],['transactions','Transactions','tx'],['payments','Payments','card'],['receipts','Receipts','doc'],['inspections','Inspections','check']]],['TEAM',[['agents','Agents','user']]]];
const S={page:'dashboard',tab:'overview',corr:false};
const parent={booking:'bookings',transaction:'transactions'};
function go(p,tab){S.page=p;S.tab=tab||'overview';S.corr=false;closeAll();render();scrollTo(0,0)}
function side(){const act=parent[S.page]||S.page;return `<div class="logo">Belgrove <span>Homes</span></div><div class="logo-s">OPERATIONS</div>`+NAV.map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(n=>`<div class="nav ${act==n[0]?'on':''}" onclick="go('${n[0]}')">${ico(n[2])}${n[1]}${n[3]?`<span class="bd">${n[3]}</span>`:''}</div>`).join('')).join('')}
const ph=(t,s,a='')=>`<div class="ph"><div><h1>${t}</h1><p>${s}</p></div><div class="acts">${a}</div></div>`;
const kpi=(i,l,v,e,p,c='')=>`<div class="card kpi ${c}"><div class="ki">${ico(i)}</div><small>${l}</small><div class="v">${v}${e?`<em>${e}</em>`:''}</div><p>${p}</p></div>`;
const filters=(a,sr)=>`<div class="filters">${a.map((x,i)=>`<span class="fp ${i?'':'on'}">${x}</span>`).join('')}<div class="fs">${ico('search')}${sr}</div></div>`;
const needs=[['r','Overdue '+money(9250000),'Emmanuel · TXN-2026-86823 · 1 day','Open',"go('transaction')"],['r','Overdue '+money(9250000),'Emmanuel · TXN-2026-13217 · 1 day','Open',"go('transaction')"],['r','Overdue '+money(8950000),'Emmanuel · TXN-2026-19537 · 1 day','Open',"go('transaction')"],['g','Contract date not set','Valentine Nzube Onweluzo · TXN-2026-62831','Set date',"go('transaction')"],['g','Booking has no agent','Daniel Ifenna · BEL-2026-62307','Assign',"go('booking')"]];
const needRows=()=>needs.map(n=>`<div class="row"><span class="dot ${n[0]}"></span><div class="tx"><b>${n[1]}</b><small>${n[2]}</small></div><button class="btn sm" onclick="${n[4]}">${n[3]}</button></div>`).join('');
function menu(id,items){return `<div class="rowmenu"><button class="more" onclick="toggleMenu(event,'${id}')">⋯</button><div class="pop" id="${id}">${items.map(i=>`<a class="${i[2]||''}" onclick="${i[1]}">${i[0]}${i[3]?`<small>${i[3]}</small>`:''}</a>`).join('')}</div></div>`}
const SCH=[['Initial deposit','09 Oct 2026',9250000,9250000],['Month 1','09 Nov 2026',3083333,2750000],['Month 2','09 Dec 2026',3083333,0],['Month 3','09 Jan 2027',3083334,0]];
const schStatus=r=>r[3]>=r[2]?chip('Paid','lg'):r[3]>0?chip('Part paid','gold'):chip('Upcoming','gray');
const PAY=[['09 Aug 2026',3000000,'Initial deposit','262220980712','RCT-2026-79860',''],['12 Aug 2026',3000000,'Initial deposit','262240986795','RCT-2026-31207','Originally '+money(3250000)+'. Corrected 12 Oct by Admin.'],['19 Aug 2026',3000000,'Initial deposit','2623210148410','RCT-2026-83436',''],['24 Sep 2026',3000000,'Initial deposit '+money(250000)+' · Month 1 '+money(2750000),'','RCT-2026-45918','Originally '+money(2750000)+'. Corrected 12 Oct by Admin.']];
const OLD=[['12 Aug 2026',3250000,'RCT-2026-69739'],['24 Sep 2026',2750000,'RCT-2026-29367']];
const PAGES={
dashboard(){return ph('Dashboard','What needs you today.')+`<div class="kpis">${kpi('card','Collected this month','₦18.9M','▲ 587%','Confirmed payments vs last month')}${kpi('clock','Awaiting bank check','0','','₦0 to verify')}${kpi('alert','Overdue','3','','₦27,450,000 behind schedule','red')}${kpi('tx','Active transactions','6','','1 paid in full')}</div>
<div class="grid2"><div class="card"><div class="card-h"><h3>Needs action</h3><a class="lnk" onclick="go('inbox')">Open inbox →</a></div>${needRows()}</div>
<div class="card"><div class="card-h"><h3>Latest payments</h3><a class="lnk" onclick="go('payments')">View all →</a></div>${[['Valentine Nzube Onweluzo','24 Sep · Bank transfer',3000000],['Azubuike Nnamdi Mac Anthony','07 Oct · Bank transfer',5800000],['Valentine Nzube Onweluzo','19 Aug · Bank transfer',3000000],['Walk-in client','09 Oct · Cash',300000]].map(p=>`<div class="row"><div class="tx"><b>${p[0]}</b><small>${p[1]}</small></div><span class="mono">${money(p[2])}</span></div>`).join('')}</div></div>`},
